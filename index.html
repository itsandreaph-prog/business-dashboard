<!DOCTYPE html>
<html>
<head>
  <title>My Business Dashboard</title>

  <style>
    body{
      font-family: Arial;
      background:#f6f0ff;
      padding:20px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:15px;
      margin-bottom:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      color:#7b4dff;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:10px;
      border:1px solid #ccc;
    }

    button{
      background:#7b4dff;
      color:white;
      border:none;
      padding:10px 20px;
      border-radius:10px;
      margin-top:10px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h1>My Business Dashboard</h1>

<div class="card">
  <h2>Today's Sales</h2>
  <input type="number" id="sales" placeholder="Enter today's sales">
</div>

<div class="card">
  <h2>Customer Inquiries</h2>
  <input type="number" id="inquiries" placeholder="Enter inquiries today">
</div>

<div class="card">
  <h2>Stock Left</h2>
  <input type="number" id="stock" placeholder="Enter stock left">
</div>

<div class="card">
  <h2>AI Suggestion</h2>

  <button onclick="analyzeBusiness()">
    Analyze Business
  </button>

  <p id="result"></p>
</div>

<script>

async function analyzeBusiness(){

  let sales = document.getElementById("sales").value;
  let inquiries = document.getElementById("inquiries").value;
  let stock = document.getElementById("stock").value;

  document.getElementById("result").innerText =
  "Analyzing...";

  const prompt = `
  My business data today:

  Sales: ${sales}
  Inquiries: ${inquiries}
  Stock Left: ${stock}

  Give business advice to improve my bracelet and polaroid business.
  Keep the advice short and useful.
  `;

  const response = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyAcJE157iJIiz7DxjQ2ig0xeBSimMCFZFs",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        contents:[
          {
            parts:[
              {
                text: prompt
              }
            ]
          }
        ]
      })
    }
  );

  const data = await response.json();

  const text =
  data.candidates[0].content.parts[0].text;

  document.getElementById("result").innerText =
  text;

}

</script>
</body>
</html>
