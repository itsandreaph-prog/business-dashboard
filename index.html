<!DOCTYPE html>
<html>
<head>
  <title>My Business Dashboard</title>

  <style>
    body{
      font-family: Arial;
      background:#f6f0ff;
      padding:20px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:15px;
      margin-bottom:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      color:#7b4dff;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:10px;
      border:1px solid #ccc;
    }

    button{
      background:#7b4dff;
      color:white;
      border:none;
      padding:10px 20px;
      border-radius:10px;
      margin-top:10px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h1>My Business Dashboard</h1>

<div class="card">
  <h2>Today's Sales</h2>
  <input type="number" id="sales" placeholder="Enter today's sales">
</div>

<div class="card">
  <h2>Customer Inquiries</h2>
  <input type="number" id="inquiries" placeholder="Enter inquiries today">
</div>

<div class="card">
  <h2>Stock Left</h2>
  <input type="number" id="stock" placeholder="Enter stock left">
</div>

<div class="card">
  <h2>AI Suggestion</h2>

  <button onclick="analyzeBusiness()">
    Analyze Business
  </button>

  <p id="result"></p>
</div>

<script>

async function analyzeBusiness() {

  let sales = document.getElementById("sales").value;
  let inquiries = document.getElementById("inquiries").value;
  let stock = document.getElementById("stock").value;

  document.getElementById("result").innerText = "Analyzing...";

  try {

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=AIzaSyCUFEKEL8sGoSwI7_om3lnsN_cLyMkJUVM",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              parts: [
                {
                  text:
                  `Sales today: ${sales}
                  Customer inquiries: ${inquiries}
                  Stock left: ${stock}

                  Give short business advice for my bracelet business.`
                }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    console.log(data);

    if (data.error) {
      document.getElementById("result").innerText =
      data.error.message;
      return;
    }

    document.getElementById("result").innerText =
    data.candidates[0].content.parts[0].text;

  } catch(error) {

    document.getElementById("result").innerText =
    error.message;

  }

}

</script>
</body>
</html>
